# With env parameters for deployment in different env subscription  with single pipeline


trigger: none
pr: none

parameters:
  - name: environment
    displayName: Select Environment
    type: string
    default: dev
    values:
      - dev
      - uat

pool:
  vmImage: ubuntu-latest

variables:
  - name: TF_VERSION
    value: '1.15.6'

  # Shared Terraform backend configuration
  - name: resourceGroupName
    value: 'YOUR-TFSTATE-RESOURCE-GROUP'

  - name: storageAccountName
    value: 'YOUR-TFSTATE-STORAGE-ACCOUNT'

  - name: containerName
    value: 'mycontainer'

  # Select DEV configuration
  - ${{ if eq(parameters.environment, 'dev') }}:
      - name: WORKING_DIR
        value: '$(System.DefaultWorkingDirectory)/AKS/environments/dev'

      - name: backendKey
        value: 'dev.terraform.tfstate'

      - name: service_connection
        value: 'myazserviceconnection-dev'

      - name: aksClusterName
        value: 'sammyaks'

      - name: acrName
        value: 'sameeracr'

      - name: acrLoginServer
        value: 'sameeracr.azurecr.io'

      - name: imageRepository
        value: 'microtodo-app'

      - name: kubernetesNamespace
        value: 'dev'

  # Select UAT configuration
  - ${{ if eq(parameters.environment, 'uat') }}:
      - name: WORKING_DIR
        value: '$(System.DefaultWorkingDirectory)/AKS/environments/uat'

      - name: backendKey
        value: 'uat.terraform.tfstate'

      - name: service_connection
        value: 'myazserviceconnection-uat'

      - name: aksClusterName
        value: 'sammyaks-uat'

      - name: acrName
        value: 'sameeracr'

      - name: acrLoginServer
        value: 'sameeracr.azurecr.io'

      - name: imageRepository
        value: 'microtodo-app'

      - name: kubernetesNamespace
        value: 'uat'

  - name: imageTag
    value: '$(Build.BuildId)'

  - name: TF_PLAN_NAME
    value: 'tfplan'

stages:

  # ==========================================
  # STAGE 1: SECURITY AND COMPLIANCE
  # ==========================================
  - stage: SecurityAndCompliance
    displayName: Security and Compliance

    jobs:
      - job: SecurityScanJob
        displayName: Run Terraform Security Scans

        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '$(TF_VERSION)'

          - task: Bash@3
            displayName: Install TFLint
            inputs:
              targetType: inline
              script: |
                set -e
                curl -sSLO https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip
                unzip -o tflint_linux_amd64.zip
                sudo install -c -v tflint /usr/local/bin/

          - task: Bash@3
            displayName: Install Checkov
            inputs:
              targetType: inline
              script: |
                set -e
                python3 -m pip install --user checkov
                echo "##vso[task.prependpath]$HOME/.local/bin"

          - task: Gitleaks@3
            displayName: Gitleaks Scan
            continueOnError: true
            inputs:
              scanlocation: '$(System.DefaultWorkingDirectory)'
              configtype: default
              reportformat: sarif
              reportname: gitleaks.sarif

          - task: Bash@3
            displayName: Run TFLint
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                tflint --chdir="$(WORKING_DIR)" --recursive

          - task: Bash@3
            displayName: Run Checkov
            continueOnError: true
            inputs:
              targetType: inline
              script: |
                checkov -d "$(WORKING_DIR)" \
                  --framework terraform \
                  -o junitxml > Checkov-Result.xml

          - task: PublishTestResults@2
            displayName: Publish Checkov Results
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: Checkov-Result.xml
              failTaskOnFailedTests: false

  # ==========================================
  # STAGE 2: TERRAFORM PLAN
  # ==========================================
  - stage: TerraformPlan
    displayName: Terraform Init Validate and Plan
    dependsOn: SecurityAndCompliance

    jobs:
      - job: TerraformPlanJob
        displayName: Generate Terraform Plan

        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '$(TF_VERSION)'

          # Backend connection accesses state storage.
          # Target service connection authenticates Terraform provider.
          - task: TerraformTask@5
            displayName: Terraform Init
            inputs:
              provider: azurerm
              command: init
              workingDirectory: '$(WORKING_DIR)'
              backendServiceArm: 'myazbackendconnection'
              backendAzureRmOverrideSubscriptionID: '$(BACKEND_SUBSCRIPTION_ID)'
              backendAzureRmResourceGroupName: '$(resourceGroupName)'
              backendAzureRmStorageAccountName: '$(storageAccountName)'
              backendAzureRmContainerName: '$(containerName)'
              backendAzureRmKey: '$(backendKey)'

          - task: TerraformTask@5
            displayName: Terraform Validate
            inputs:
              provider: azurerm
              command: validate
              workingDirectory: '$(WORKING_DIR)'

          - task: TerraformTask@5
            displayName: Terraform Plan
            inputs:
              provider: azurerm
              command: plan
              workingDirectory: '$(WORKING_DIR)'
              environmentServiceNameAzureRM: '$(service_connection)'
              commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'

          - task: PublishPipelineArtifact@1
            displayName: Publish Terraform Plan
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
              artifact: terraform-plan
              publishLocation: pipeline

          - task: Bash@3
            displayName: Install Infracost
            inputs:
              targetType: inline
              script: |
                set -e
                curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh
                infracost --version

          - task: Bash@3
            displayName: Estimate Infrastructure Cost
            inputs:
              targetType: inline
              script: |
                infracost breakdown \
                  --path "$(WORKING_DIR)" \
                  --format table
            env:
              INFRACOST_API_KEY: $(INFRACOST_API_KEY)

  # ==========================================
  # STAGE 3: APPROVAL AND APPLY
  # ==========================================
  - stage: TerraformApply
    displayName: Deploy ${{ upper(parameters.environment) }}
    dependsOn: TerraformPlan

    # Retains your original main-branch deployment restriction.
    condition: and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )

    jobs:
      - job: ManualApproval
        displayName: Approve Infrastructure Changes
        pool: server
        timeoutInMinutes: 1440

        steps:
          - task: ManualValidation@0
            displayName: Review and Approve Terraform Plan
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: |
                benamikumar@gmail.com
              instructions: |
                Review the Terraform plan artifact.
                Environment: ${{ parameters.environment }}
                Approve only if the selected subscription,
                resource changes and environment are correct.
              onTimeout: reject

      - job: TerraformApplyJob
        displayName: Apply Approved Plan
        dependsOn: ManualApproval

        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '$(TF_VERSION)'

          # Initialize the SAME backend and state key used in Plan.
          - task: TerraformTask@5
            displayName: Terraform Init for Apply
            inputs:
              provider: azurerm
              command: init
              workingDirectory: '$(WORKING_DIR)'
              backendServiceArm: 'myazbackendconnection'
              backendAzureRmOverrideSubscriptionID: '$(BACKEND_SUBSCRIPTION_ID)'
              backendAzureRmResourceGroupName: '$(resourceGroupName)'
              backendAzureRmStorageAccountName: '$(storageAccountName)'
              backendAzureRmContainerName: '$(containerName)'
              backendAzureRmKey: '$(backendKey)'

          - task: DownloadPipelineArtifact@2
            displayName: Download Approved Terraform Plan
            inputs:
              artifact: terraform-plan
              path: '$(Pipeline.Workspace)/terraform-plan'

          - task: TerraformTask@5
            displayName: Apply Approved Terraform Plan
            inputs:
              provider: azurerm
              command: apply
              workingDirectory: '$(WORKING_DIR)'
              environmentServiceNameAzureRM: '$(service_connection)'
              commandOptions: '$(Pipeline.Workspace)/terraform-plan/tfplan'






